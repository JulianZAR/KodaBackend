# Tema de login de NutriGO: replica el diseño de la pantalla de login de Angular.
# login.ftl y register.ftl son propios; el resto de pantallas (recuperar
# contraseña, errores, acciones requeridas) usan las plantillas del tema "base"
# dentro de nuestro template.ftl, con las clases kc* mapeadas a nutrigo.css.
parent=base
import=common/keycloak
locales=es

styles=css/nutrigo.css
scripts=js/nutrigo.js

kcFormClass=ng-form
kcFormGroupClass=ng-field
kcFormSettingClass=ng-setting
kcLabelWrapperClass=
kcLabelClass=ng-label
kcInputWrapperClass=
kcInputClass=ng-input ng-input-plain
kcInputErrorMessageClass=ng-field-error
kcInputHelperTextBeforeClass=ng-help
kcInputHelperTextAfterClass=ng-help
kcFormOptionsClass=ng-options
kcFormOptionsWrapperClass=
kcFormButtonsClass=ng-actions
kcButtonClass=ng-btn
kcButtonPrimaryClass=ng-btn-primary
kcButtonDefaultClass=ng-btn-secondary
kcButtonBlockClass=ng-btn-block
kcButtonLargeClass=
kcCheckboxInputClass=ng-checkbox
kcSelectClass=ng-input ng-input-plain
kcTextareaClass=ng-input ng-input-plain
